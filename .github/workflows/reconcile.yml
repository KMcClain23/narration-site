# The H1 reconciliation check, run on every push and pull request.
#
# WHAT THIS IS AND IS NOT. This is a signal on the repository, not a deploy
# gate. Vercel builds from GitHub independently of Actions, so a red run here
# does NOT stop a deploy. Treating it as a gate would be the same mistake the
# check itself exists to prevent: something that looks like it is holding a
# line and is not.
#
# CREDENTIALS. The check reads the database with the service-role key, so it
# needs two repository secrets:
#     NEXT_PUBLIC_SUPABASE_URL
#     SUPABASE_SERVICE_ROLE_KEY
# Settings -> Secrets and variables -> Actions. Until they are added this
# workflow FAILS — deliberately. It does not skip when the secrets are absent,
# because a skipped run reports green, and a green tick that checked nothing is
# worse than a red one that says so out loud.
#
# It runs against the LIVE database, which is what makes it worth anything: the
# figures it reconciles are the real ones. That also means it can go red because
# the data changed rather than because the code did. When it does, the output
# names the card and both figures.
name: Reconcile card economics

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript and the database must agree on every card
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check-card-economics:ci
      - name: The rs_plus branch, on both sides, against one hand-derived figure
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check-rs-plus:ci
      - name: The card-level payout branch, on both sides, against hand-derived figures
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check-card-payout:ci
      - name: The board_cards RLS policy set, pinned
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check-board-policies:ci

      # The role a new account gets, from BOTH producers: the column default and
      # handle_new_user. profiles.role defaulted to 'editor' from before E1 gave
      # that role meaning, so every account created was silently granted the
      # whole board. Nothing changed; the meaning did.
      - name: A new account must get a role no gate admits
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check-new-account-role:ci

      # co_narrators and narrators both mean "narrator" and were joined by a
      # string match. They now share a key; this notices when they come apart
      # anyway, which neither screen shows.
      - name: The two narrator tables must agree
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check-narrator-sync:ci

      # ── The Android DTOs must match the functions they decode ────────────
      #
      # The app decodes with ignoreUnknownKeys = false, so a column added to a
      # function it reads does not degrade a row — it throws and empties the
      # screen, on every build already installed.
      #
      # editor_assignments() was widened for the website and the Editing tab
      # went to "No books are in editing": plausible, quiet and wrong.
      # DecoderExposureTest existed and missed it, because it pinned one DTO
      # while the audit behind it listed fourteen relations.
      #
      # Needs the Android repo checked out beside this one; skipped with a
      # LOUD note when it is absent, never reported as a pass.
      - name: Check out the Android repo
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: KMcClain23/dmn-admin-android
          path: dmn-admin-android
          token: ${{ secrets.ANDROID_REPO_TOKEN }}

      - name: Every decoded relation must match its DTO
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANDROID_REPO: dmn-admin-android
        run: |
          if [ ! -d dmn-admin-android/app/src/main/java ]; then
            echo "::warning::the Android repo was not checked out — DTO drift was NOT checked."
            echo "Add ANDROID_REPO_TOKEN, or run 'npm run check-android-dtos' locally before a release."
            exit 0
          fi
          npm run check-android-dtos:ci

      # ── Every catalogue link must actually open ──────────────────────────
      #
      # /api/books and /narrated-works/[slug] each kept their own status list
      # and disagreed by one value, so Ruined and The Wolf King's Bride were
      # listed, linked, and 404'd. Both endpoints were individually correct;
      # the bug was in the gap, which is only visible by FOLLOWING the link.
      #
      # The lists are one import now, so this cannot recur the same way — but
      # that is exactly what was said after admin-routes.ts and after the two
      # narrator tables, and it came back a third time. This checks the
      # behaviour rather than the arrangement.
      #
      # Against a LOCALLY BUILT server, not production: on a pull request the
      # point is to check the code in the PR, and pointing it at the live site
      # would report on whatever is already deployed.
      - name: Build the site so the catalogue can be walked
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Every book on the catalogue must have a detail page that loads
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm run start &
          SERVER_PID=$!
          # Wait for a real 200 from the endpoint under test, not a fixed sleep:
          # a sleep that is too short reports a connection error as a broken
          # catalogue, which is the error-as-absence confusion in another suit.
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://localhost:3000/api/books; then break; fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "the server exited before it answered"; exit 1
            fi
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:3000/api/books || {
            echo "the server never answered — this is a failure to check, not a pass"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          }
          npm run check-catalogue-links:ci
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS
